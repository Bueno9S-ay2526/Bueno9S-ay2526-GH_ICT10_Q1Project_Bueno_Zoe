<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>SKU Generator</title>
</head>
<body style="background-color: rgb(253, 235, 130); display: flex; flex-direction: column; min-height: 100vh;">
    <nav class="navbar navbar-expand-sm" style="background-color: rgb(101,219,255); padding: 20px;">
        <div class="nav-links">
            <a href="sku.html" style="all: unset; color: rgb(255,116,177); margin-left: 5px; margin-right: 15px;"><b>SKU Generator</b></a>
            <a href="index.html" class="active" style="all: unset; color: rgb(255,116,177);"><b>Receipt Generator</b></a>
            <!-- Allows us to switch between the index.html and the sku.html pages-->
        </div>
    </nav>
    <div class="sku-container" style="background-color: white; color:rgb(255,116,177); margin: 0 auto; padding: 20px; width: 40%; text-align: center; line-height: 1.7; border-radius: 11px; margin-top: 40px; margin-bottom: 40px;height: 100%; flex: 1;">
        <legend><b>SKU Generator</b></legend>
        <div class="sku-content">
                <label for="category" style="font-weight: bold;">Category</label><br>
                <select id="category" class="form-control">
                    <option value="TOP">Type of Products</option>
                    <option value="CAF">Caffienated Product/s</option>
                    <option value="NCF">Non-Caffienated Product/s</option>
                </select>
                <br>
                <label for="product_name" style="font-weight: bold;">Product</label><br>
                <select id="product_name" class="form-control">
                    <option value="Mocha">
                        Mocha
                    </option>
                    <option value="Hot Chocolate">
                        Hot Chocolate
                    </option>
                    <option value="Vanilla">
                        Vanilla
                    </option>
                </select>
                <br>
                <label for="stock_quantity" style="font-weight: bold;">Stock Quantity</label><br>
                <input type="number" class="form-control" id="stock_quantity" placeholder="e.g. 21">
                <br>
                <button class="btn btn-primary mt-3" type="submit" py-click="generate_sku">Get SKU</button>
                <!-- Press to generate the SKU-->
                <br>
                <div id="sku-box" style="border: 1px solid #ccc; padding: 20px; width: 70%; margin: 0 auto; margin-top: 20px;">
                    <div id="sku-product"><b>???-???-???</b></div>
                    <!-- SKU will appear here-->
                </div>
            </div>
    </div>
    <footer style="background-color: rgb(101,219,255); color:rgb(255,116,177); padding: 15px; text-align: center;">
        <b>10S Q1 Project - Receipt Generator</b><br>
        <p>by Zoe Alexandra T. Bueno</p>
    </footer>
    <py-script src="main.py"></py-script>
</body>
</html>
