<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>SkillsTest</title>
</head>
<body style="background-color: rgb(253, 235, 130); display: flex; flex-direction: column; min-height: 100vh;">
    <nav class="navbar navbar-expand-sm" style="background-color: rgb(101,219,255); padding: 20px;">
        <div class="nav-links">
            <a href="sku.html" style="all: unset; color: rgb(255,116,177); margin-left: 5px; margin-right: 15px;"><b>SKU Generator</b></a>
            <a href="index.html" class="active" style="all: unset; color: rgb(255,116,177);"><b>Receipt Generator</b></a>
            <!-- Allows us to switch between the index.html and the sku.html pages-->
        </div>
    </nav>
    <main class="container" style="background-color: white; color:rgb(255,116,177); margin: 0 auto; padding: 20px; width: 40%; text-align: center; line-height: 1.7; border-radius: 11px; margin-top: 45px; margin-bottom: 45px;height: 100%; flex: 1;">
        <legend><b>Drinks</b> <i>(Order as much as you want)</i></legend>
        <input type="checkbox" id="iced mocha" value="121">
        <label id="iced mocha-label" style="font-weight: bold;">Iced Mocha</label>
        <br>
        <input type="checkbox" id="hot mocha" value="121">
        <label id="hot mocha-label" style="font-weight: bold;">Hot Mocha</label>
        <br>
        <input type="checkbox" id="hot chocolate" value="100">
        <label id="hot chocolate-label" style="font-weight: bold;">Hot Chocolate</label>
        <br>
        <input type="checkbox" id="iced vanilla" value="112">
        <label id="iced vanilla-label" style="font-weight: bold;">Iced Vanilla</label>
        <br>
        <input type="checkbox" id="hot vanilla" value="112">
        <label id="hot vanilla-label" style="font-weight: bold;">Hot Vanilla</label>
        <br>
        <button class="btn btn-primary mt-3" type="submit" py-click="make_receipt">Get receipt</button>
        <!--Click to get the receipt!-->
        <br>
        <br>
        <div id="receipt-box" style="border: 1px solid #ccc; padding: 20px; width: 70%; margin: 0 auto;">
            <b>Receipt</b>
            <div id="receipt"><!--Receipt will appear here--></div>
        </div>
    </main>
    <footer style="background-color: rgb(101,219,255); color:rgb(255,116,177); padding: 15px; text-align: center;">
        <b>10S Q1 Project - Receipt Generator</b><br>
        <p>by Zoe Alexandra T. Bueno</p>
    </footer>
    <py-script src="main.py"></py-script>
</body>
</html>
